[package]
name = "olens_core"
version = "0.1.0"
edition = "2021"
authors = ["Ayush <ayushpalg46>"]
description = "High-performance native core for Olens Launcher (Rust + JNI)"

[lib]
name = "olens_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

